[project]
name = "llm-se-2027"
version = "0.1.0"
description = "Course materials for Software Engineering with AI (LLM-SE 2027), BGU"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "jupyterlab>=4.5.0",
    "ruff>=0.14.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.pyright]
typeCheckingMode = "strict"
# dspy/ is a separate uv project with its own .venv (dspy, mcp, mlflow, ...). Resolve its
# imports from there, and silence the strict "unknown type" noise from those untyped libraries.
executionEnvironments = [
    { root = "dspy", extraPaths = ["dspy/.venv/lib/python3.14/site-packages"], reportMissingTypeStubs = false, reportUnknownMemberType = false, reportUnknownArgumentType = false, reportUnknownVariableType = false, reportUnknownLambdaType = false },
    { root = "." },
]
